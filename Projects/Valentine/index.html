<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cara Mia, Will You Be My Valentine? 💖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #ff6b8b, #ff8e6b, #ffd166, #ffb3ba);
      background-size: 200% 200%;
      animation: gradientShift 25s ease infinite;
      overflow: hidden;
      color: white;
      position: relative;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: .5;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .2
      }

      50% {
        opacity: 1
      }
    }

    .heart {
      position: absolute;
      font-size: 18px;
      opacity: .15;
      animation: floatUp 20s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh)
      }

      to {
        transform: translateY(-120vh)
      }
    }

    .glass {
      background: rgba(255, 255, 255, .18);
      padding: 40px 25px;
      border-radius: 30px;
      text-align: center;
      width: 90%;
      max-width: 600px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .3);
      box-shadow: 0 25px 60px rgba(0, 0, 0, .2);
      z-index: 10;
      transition: all .6s ease;
    }

    /* PHOTO STYLES */
    .photo-container {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }

    button {
      padding: 14px 26px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .3s ease;
      position: relative;
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff2e63, #ff8e6b);
      color: white;
      box-shadow: 0 0 25px rgba(255, 46, 99, .8);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    #noBtn {
      background: #333;
      color: white;
    }

    .hidden {
      display: none
    }

    #letterSection {
      position: fixed;
      inset: 0;
      padding: 80px 20px;
      overflow-y: auto;
      background: rgba(0, 0, 0, .25);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      z-index: -1;
      opacity: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .letter {
      max-width: 700px;
      width: 100%;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      line-height: 1.8;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      background: white;
      margin-left: 3px;
      animation: blink 1s infinite;
    }

    @keyframes blink {

      0%,
      50%,
      100% {
        opacity: 1
      }

      25%,
      75% {
        opacity: 0
      }
    }

    #foreverBtn {
      margin-top: 60px;
      padding: 16px 30px;
      font-size: 1.2rem;
      background: linear-gradient(45deg, #ff2e63, #ff8e6b);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 25px rgba(255, 46, 99, .8);
    }

    .ring {
      position: fixed;
      font-size: 80px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: ringPop 1s ease forwards;
      z-index: 9999;
    }

    @keyframes ringPop {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0
      }

      50% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0
      }
    }

    .ringSparkle {
      position: fixed;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      animation: sparkleBurst 1s ease-out forwards;
    }

    @keyframes sparkleBurst {
      to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <audio id="bgMusic" loop>
    <source src="assets/music/I Wanna Be Yours.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Generate background effects
    for (let i = 0; i < 40; i++) {
      const s = document.createElement("div"); s.className = "sparkle"; s.style.left = Math.random() * 100 + "vw"; s.style.top = Math.random() * 100 + "vh"; s.style.animationDelay = Math.random() * 3 + "s"; document.body.appendChild(s);
    }
    for (let i = 0; i < 8; i++) {
      const h = document.createElement("div"); h.className = "heart"; h.innerText = "💖"; h.style.left = Math.random() * 100 + "vw"; h.style.animationDelay = Math.random() * 10 + "s"; document.body.appendChild(h);
    }
  </script>

  <div class="glass" id="mainCard">
    <div class="photo-container">
      <img src="assets/image/us.png" alt="Our Photo" class="profile-photo" loading="lazy">
    </div>
    <h1>Will You Be My Valentine? 💖</h1>
    <div class="buttons">
      <button id="yesBtn">YES ❤️</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>

  <div id="letterSection" class="hidden">
    <div class="letter" id="letterContainer"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const mainCard = document.getElementById("mainCard");
    const letterSection = document.getElementById("letterSection");
    const letterContainer = document.getElementById("letterContainer");
    const bgMusic = document.getElementById("bgMusic");

    let yesScale = 1;
    let noScale = 1;
    const noTexts = ["Are you sure? 🥺", "Don't do that...", "Think again 💔", "Please...", "Try yes ❤️", "Remember the times we shared", "You're breaking my heart 💔"];

    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      yesScale += .15;
      noScale -= .1;
      if (noScale < .4) noScale = .4;
      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform = `scale(${noScale})`;
      noBtn.textContent = noTexts[Math.floor(Math.random() * noTexts.length)];
    });

    yesBtn.addEventListener("click", () => {
      bgMusic.play().catch(e => console.log("Audio play blocked:", e));
      mainCard.style.opacity = "0";
      setTimeout(() => {
        mainCard.classList.add("hidden");
        letterSection.style.display = "flex"; // Show it
        letterSection.style.zIndex = "100";   // Bring to front
        letterSection.style.opacity = "1";    // Fade in
        startLetter();
      }, 600);
    });

    const noteLines = [
      "TO CARA MIA 💖",
      "On a day that speaks of love, my heart ofcourse rests entirely with you.",
      "But for me, Valentine's is less about the grand gesture it suggests,",
      "And more about pausing to consciously honour the miraculous, constant light you are in my life.",
      "You are the person my thoughts seek first, and my quietest gratitude is for you.",
      "I want you to know, deeply and truly, the impact you have on my world.",
      "What we have is the poetry I always hoped to find, written not just in words,",
      "But in the rhythm of our shared breaths and the comfort of our silence.",
      "You transform ordinary moments into treasures.",
      "Thank you for being my sanctuary and my most beautiful spark.",
      "My life is infinitely more alive because YOU are in it.",
      "YOU are my partner, my muse, and my home.",
      "Today, and every day, I choose you. I LOVE you.",
      "Yours, always and completely,",
      "And I will keep choosing you.",
      "Forever. 💍"
    ];

    async function startLetter() {
      for (const line of noteLines) {
        await typeLine(line);
        await new Promise(r => setTimeout(r, 700));
      }
      const foreverBtn = document.createElement("button");
      foreverBtn.id = "foreverBtn";
      foreverBtn.textContent = "Forever 💍";
      letterContainer.appendChild(foreverBtn);
      foreverBtn.style.display = "block";
      foreverBtn.addEventListener("click", ringSparkleEffect);
    }

    function typeLine(text) {
      return new Promise(resolve => {
        const p = document.createElement("p");
        letterContainer.appendChild(p);
        let i = 0;
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        p.appendChild(cursor);
        const typing = setInterval(() => {
          if (i < text.length) {
            p.insertBefore(document.createTextNode(text[i]), cursor);
            i++;
            letterSection.scrollTop = letterSection.scrollHeight;
          } else {
            clearInterval(typing);
            cursor.remove();
            resolve();
          }
        }, 60);
      });
    }

    function ringSparkleEffect() {
      const ring = document.createElement("div");
      ring.className = "ring"; ring.textContent = "💍";
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 1000);
      for (let i = 0; i < 25; i++) {
        const spark = document.createElement("div");
        spark.className = "ringSparkle";
        spark.style.setProperty("--x", (Math.random() * 300 - 150) + "px");
        spark.style.setProperty("--y", (Math.random() * 300 - 150) + "px");
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 1000);
      }
    }
  </script>
</body>

</html>
